name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK r27
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust (android + musl targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,aarch64-unknown-linux-musl

      - name: Build supervisor (aarch64-linux-android)
        working-directory: supervisor
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export RANLIB_aarch64_linux_android="$TC/llvm-ranlib"
          cargo build --target aarch64-linux-android --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/supervisor \
             ../app/src/main/jniLibs/arm64-v8a/libsupervisor.so

      # The musl guest must link with rust-lld: the host cc's GNU ld
      # does not understand the aarch64 cortex-a53 erratum flag rustc
      # passes for this target.
      - name: Build guest (aarch64-unknown-linux-musl, static)
        working-directory: guest
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld
          cargo build --target aarch64-unknown-linux-musl --release
          cp target/aarch64-unknown-linux-musl/release/guest \
             ../app/src/main/jniLibs/arm64-v8a/libguest.so

      # M1 guest: static busybox 1.36.1 built from source against
      # musl with CONFIG_FEATURE_SUID=n. Why not a prebuilt package:
      # a FEATURE_SUID=y busybox runs a privilege-drop sequence at
      # every startup (ruid = getuid(), then setgid(rgid), then
      # setuid(ruid) -- libbb/appletlib.c, all inside the
      # FEATURE_SUID guard) even when the binary is not setuid, and
      # Android's app seccomp filter TRAPs the set*id family
      # (bionic SECCOMP_BLOCKLIST_APP lists setgid/setuid/setresgid/
      # setgroups/setfsuid/setfsgid), killing the guest before
      # main() -- proven on a real device across 0.2.1-0.2.5. The
      # supervisor cannot cancel those calls on this kernel
      # (5.4.233 vendor): rewrites at the ptrace entry stop do not
      # stop the filter evaluating the original syscall number.
      # So the calls must not exist: with FEATURE_SUID=n the whole
      # sequence is compiled out and startup touches no set*id.
      # Toolchain: Bootlin's aarch64 musl cross gcc 12.3 (tarball
      # sha256 pinned below, cross-checked against Bootlin's
      # published .sha256), so busybox is compiled against musl
      # end to end, never glibc (the earlier glibc-built guest died
      # even earlier, on rseq at startup). musl.cc was the first
      # choice but is unreachable from GitHub runners (run
      # 42036094797 step 8: curl connect timeout to musl.cc:443),
      # so the toolchain comes from toolchains.bootlin.com. The Alpine busybox-static
      # package used in 0.2.1-0.2.5 has FEATURE_SUID=y compiled in,
      # which is exactly what has to go.
      - name: Build busybox (musl, from source, FEATURE_SUID=n)
        run: |
          set -euo pipefail
          # Bootlin tarball layout: a single top-level directory
          # (aarch64--musl--stable-2023.11-1/) holding bin/, lib/,
          # and the target sysroot; its cross prefix is
          # aarch64-linux- (bin/aarch64-linux-gcc, verified against
          # the tarball contents), NOT musl.cc's aarch64-linux-musl-.
          curl -fsSL --retry 3 --connect-timeout 30 -o bootlin-musl.tar.bz2 \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2023.11-1.tar.bz2"
          echo "3554391a9ae82cc1fe35a6ab0c9efa34a5bac5474b6d527474997256e148c297  bootlin-musl.tar.bz2" | sha256sum -c -
          mkdir -p bootlin-musl
          tar -xjf bootlin-musl.tar.bz2 -C bootlin-musl --strip-components=1
          export PATH="$PWD/bootlin-musl/bin:$PATH"
          curl -fsSL -o busybox-1.36.1.tar.bz2 \
            "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
          echo "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  busybox-1.36.1.tar.bz2" | sha256sum -c -
          tar xjf busybox-1.36.1.tar.bz2
          # The tarball's top-level directory is busybox-1.36.1/
          # (verified against the tar listing); everything below
          # runs inside it.
          cd busybox-1.36.1
          test -f Makefile
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux- defconfig
          # BusyBox ships no scripts/config (that helper is a
          # Linux-kernel tool and is absent from the 1.36.1 tree),
          # so flip options in .config directly, then let oldconfig
          # settle dependencies. The grep assertions fail the step
          # if an option does not end up as intended, checked both
          # before and after oldconfig (oldconfig must not be able
          # to resurrect FEATURE_SUID via its sub-options).
          # CONFIG_TC is turned OFF: 1.36.1's tc applet uses CBQ
          # definitions that current kernel headers have removed,
          # and the guest has no use for tc anyway.
          sed -i 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' .config
          sed -i 's/^# CONFIG_FEATURE_SH_STANDALONE is not set$/CONFIG_FEATURE_SH_STANDALONE=y/' .config
          sed -i 's/^CONFIG_TC=y$/# CONFIG_TC is not set/' .config
          sed -i 's/^CONFIG_FEATURE_SUID=y$/# CONFIG_FEATURE_SUID is not set/' .config
          grep -q "^CONFIG_STATIC=y" .config
          grep -q "^CONFIG_FEATURE_SH_STANDALONE=y" .config
          grep -q "^# CONFIG_TC is not set" .config
          grep -q "^# CONFIG_FEATURE_SUID is not set" .config
          # pipefail would let yes(1)'s SIGPIPE fail this pipeline;
          # the status that matters is make's, i.e. the last
          # command's, which is what remains with pipefail off.
          set +o pipefail
          yes '' | make ARCH=arm64 CROSS_COMPILE=aarch64-linux- oldconfig
          set -o pipefail
          grep -q "^CONFIG_STATIC=y" .config
          grep -q "^CONFIG_FEATURE_SH_STANDALONE=y" .config
          grep -q "^# CONFIG_TC is not set" .config
          grep -q "^# CONFIG_FEATURE_SUID is not set" .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux- -j"$(nproc)"
          file busybox | grep -q "statically linked"
          # The guest acceptance script drives these applets; fail
          # here if the build ever drops one. BusyBox packs applet
          # names as short NUL-separated strings, so match whole
          # lines from strings -n 2. The strings dump goes to a
          # file first: grep -q exiting on match would SIGPIPE the
          # producer and pipefail would report a false failure.
          strings -n 2 busybox > ../bb-strings.txt
          for applet in sh echo pwd cd cat ls wc mkdir touch rm uname; do
            grep -qx "$applet" ../bb-strings.txt \
              || { echo "busybox missing applet: $applet" >&2; exit 1; }
          done
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp busybox "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libbusybox.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      # S2 probe guest: the same busybox 1.36.1, built the same way
      # (musl, from source, FEATURE_SUID=n) but for 32-bit ARM with
      # Bootlin's armv7-eabihf musl toolchain (sha256 pinned from
      # Bootlin's published .sha256 sidecar). The supervisor gained
      # compat-personality support in 0.2.8; this binary is the
      # probe that exercises it -- same source, same config, only
      # the word size differs, so the probe isolates exactly one
      # variable. It ships inside the arm64-v8a jniLibs folder as a
      # payload file: it is exec'd from nativeLibraryDir, never
      # dlopen'd, so its ELF class does not have to match the
      # folder's ABI.
      - name: Build busybox32 (musl, from source, FEATURE_SUID=n, ARM32)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 30 -o bootlin-musl32.tar.bz2 \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--musl--stable-2023.11-1.tar.bz2"
          echo "c01a2b2a762b0e19a7847f4877ba5b35d90bd7e23704956dfe575e8113a1ad7a  bootlin-musl32.tar.bz2" | sha256sum -c -
          mkdir -p bootlin-musl32
          tar -xjf bootlin-musl32.tar.bz2 -C bootlin-musl32 --strip-components=1
          # Discover the cross prefix from the toolchain itself
          # (bin/<prefix>gcc) instead of assuming its spelling.
          GCC_BIN="$(ls "$PWD/bootlin-musl32/bin/"*-gcc | head -1)"
          PREFIX="$(basename "$GCC_BIN" | sed 's/gcc$//')"
          test -n "$PREFIX"
          echo "busybox32 cross prefix: $PREFIX"
          export PATH="$PWD/bootlin-musl32/bin:$PATH"
          curl -fsSL -o busybox32.tar.bz2 \
            "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
          echo "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  busybox32.tar.bz2" | sha256sum -c -
          mkdir -p bb32build
          tar xjf busybox32.tar.bz2 -C bb32build --strip-components=1
          cd bb32build
          test -f Makefile
          make ARCH=arm CROSS_COMPILE="$PREFIX" defconfig
          sed -i 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' .config
          sed -i 's/^# CONFIG_FEATURE_SH_STANDALONE is not set$/CONFIG_FEATURE_SH_STANDALONE=y/' .config
          sed -i 's/^CONFIG_TC=y$/# CONFIG_TC is not set/' .config
          sed -i 's/^CONFIG_FEATURE_SUID=y$/# CONFIG_FEATURE_SUID is not set/' .config
          grep -q "^CONFIG_STATIC=y" .config
          grep -q "^CONFIG_FEATURE_SH_STANDALONE=y" .config
          grep -q "^# CONFIG_TC is not set" .config
          grep -q "^# CONFIG_FEATURE_SUID is not set" .config
          set +o pipefail
          yes '' | make ARCH=arm CROSS_COMPILE="$PREFIX" oldconfig
          set -o pipefail
          grep -q "^CONFIG_STATIC=y" .config
          grep -q "^CONFIG_FEATURE_SH_STANDALONE=y" .config
          grep -q "^# CONFIG_TC is not set" .config
          grep -q "^# CONFIG_FEATURE_SUID is not set" .config
          make ARCH=arm CROSS_COMPILE="$PREFIX" -j"$(nproc)"
          file busybox | grep -q "statically linked"
          readelf -h busybox | grep -q "Class:.*ELF32"
          readelf -h busybox | grep -q "Machine:.*ARM"
          strings -n 2 busybox > ../bb32-strings.txt
          for applet in sh echo pwd cd cat ls wc mkdir touch rm uname; do
            grep -qx "$applet" ../bb32-strings.txt \
              || { echo "busybox32 missing applet: $applet" >&2; exit 1; }
          done
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp busybox "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libbusybox32.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      # S4: the manual ELF loader for dynamic guest binaries.
      # Gingerbread's linker has no standalone mode and the host
      # kernel cannot resolve the guest-absolute PT_INTERP, so
      # dynamic execs are rerouted to this loader (see
      # gbloader/gbloader.c). Built with the same Bootlin armv7
      # musl toolchain as busybox32 (extracted by the step above,
      # same job workspace), fully static and linked at a high
      # text address (0x40000000) so its image stays clear of the
      # target's fixed low addresses. (This GCC ignores
      # -static-pie; the high fixed address is the deterministic
      # equivalent.)
      - name: Build gbloader (ARM32 static, high text address, musl)
        run: |
          set -euo pipefail
          GCC_BIN="$(ls "$PWD/bootlin-musl32/bin/"*-gcc | head -1)"
          test -n "$GCC_BIN"
          "$GCC_BIN" -O2 -Wall -static -Wl,-Ttext-segment=0x40000000 \
            -o libgbloader.so gbloader/gbloader.c
          readelf -h libgbloader.so | grep -q "Class:.*ELF32"
          readelf -h libgbloader.so | grep -q "Machine:.*ARM"
          readelf -h libgbloader.so | grep -q "Type:.*EXEC"
          if readelf -l libgbloader.so | grep -q INTERP; then
            echo "gbloader must have no INTERP (fully static)" >&2
            exit 1
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp libgbloader.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a/libgbloader.so

      # S3a guest root: Android 2.3.7's init, from Google's own
      # SDK system image for API 10 (armeabi-v7a r05 — the
      # goldfish-family AOSP build; its build.prop reads
      # ro.build.version.release=2.3.7). The factory-image route
      # is dead (S1: Nexus S images return 404) and a full 2.3
      # source build is archaeology, while this is a first-party
      # AOSP build of exactly the target version. Only the
      # ramdisk's /init is used in S3a: it is fully static (no
      # INTERP), so it runs under the supervisor's compat
      # personality with no linker or libc files. Both the zip
      # and the extracted binary are sha256-pinned.
      - name: Fetch Gingerbread init (SDK API 10 system image)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 30 -o sysimg10.zip \
            "https://dl.google.com/android/repository/sys-img/android/armeabi-v7a-10_r05.zip"
          echo "b3c6188ca95bea7299b8325bd3bbd4f504fc85545befec979728f2ed169878df  sysimg10.zip" | sha256sum -c -
          unzip -o -q sysimg10.zip "armeabi-v7a/ramdisk.img"
          python3 - <<'PYEOF'
          import gzip
          data = gzip.open('armeabi-v7a/ramdisk.img', 'rb').read()
          i = 0
          found = None
          while i < len(data):
              assert data[i:i+6] == b'070701'
              h = data[i:i+110]
              namesize = int(h[94:102], 16)
              filesize = int(h[54:62], 16)
              name = data[i+110:i+110+namesize-1].decode()
              off = (i + 110 + namesize + 3) & ~3
              if name == 'init':
                  found = data[off:off+filesize]
                  break
              if name == 'TRAILER!!!':
                  break
              i = (off + filesize + 3) & ~3
          assert found is not None, 'init not found in ramdisk'
          open('gbinit', 'wb').write(found)
          print('extracted init:', len(found), 'bytes')
          PYEOF
          echo "2d9cbb198d8367f434c5fd7bada245c9e7618dc910253190f5d4dd3d0f6d1a00  gbinit" | sha256sum -c -
          readelf -h gbinit | grep -q "Class:.*ELF32"
          readelf -h gbinit | grep -q "Machine:.*ARM"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp gbinit app/src/main/jniLibs/arm64-v8a/libgbinit.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      # S4: the Gingerbread /system subset the dynamic world
      # needs -- linker, servicemanager, toolbox, sh and their
      # DT_NEEDED closure (libc, libm, libstdc++, libdl, liblog,
      # libcutils; 667,096 bytes total), taken from the same SDK
      # system image as the init above (an ext4 filesystem, read
      # with debugfs). Packed as an app asset; the shell extracts
      # it into the GB rootfs and recreates the toolbox symlinks
      # (getprop/setprop). The two anchor binaries are
      # sha256-pinned like the init.
      # paxsvc (S5b): our own guest binder client/server,
      # freestanding against the guest's libc. Linked via a
      # generated stub (soname libc.so, empty bodies) because
      # lld refuses the 2011 libc.so's symbol table; the guest
      # linker resolves the names against the real libc.so at
      # runtime. Output lands in gbsys/bin so the next step's
      # zip walk picks it up.
      - name: Build paxsvc (guest binder client/server)
        run: |
          set -euo pipefail
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > /tmp/libcst.c <<'CEOF'
          int open(void){return 0;} int close(void){return 0;} int read(void){return 0;}
          int write(void){return 0;} int ioctl(void){return 0;} void *mmap(void){return 0;}
          int munmap(void){return 0;} int mkdir(void){return 0;} void _exit(int x){(void)x;}
          int nanosleep(void){return 0;}
          void __libc_init(void){}
          CEOF
          "$TC/clang" --target=armv7a-linux-androideabi -nostdlib -shared \
            -Wl,-soname,libc.so -o /tmp/libc_stub.so /tmp/libcst.c
          mkdir -p gbsys/bin
          "$TC/clang" --target=armv7a-linux-androideabi -marm -O2 \
            -fno-stack-protector -fno-builtin -nostdlib -no-pie \
            -Wl,-e,_start -Wl,--no-undefined \
            -Wl,-dynamic-linker,/system/bin/linker \
            -o gbsys/bin/paxsvc paxsvc/paxsvc.c /tmp/libc_stub.so
          "$TC/llvm-readelf" -h gbsys/bin/paxsvc | grep -q 'Class:.*ELF32'
          "$TC/llvm-readelf" -h gbsys/bin/paxsvc | grep -q 'Type:.*EXEC'
          "$TC/llvm-readelf" -d gbsys/bin/paxsvc | grep -q 'NEEDED.*libc.so'
          if "$TC/llvm-readelf" -r gbsys/bin/paxsvc | grep -q IRELATIVE; then
            echo "paxsvc carries IRELATIVE relocs (2.3 linker cannot)" >&2; exit 1
          fi
          ls -la gbsys/bin/paxsvc
      # fbprobe (S6a): the framebuffer test-pattern client.
      # Same freestanding recipe as paxsvc; its libc stub
      # additionally carries nanosleep.
      - name: Build fbprobe (guest framebuffer client)
        run: |
          set -euo pipefail
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > /tmp/libcst_fb.c <<'CEOF'
          int open(void){return 0;} int close(void){return 0;} int read(void){return 0;}
          int write(void){return 0;} int ioctl(void){return 0;} void *mmap(void){return 0;}
          int munmap(void){return 0;} int mkdir(void){return 0;} void _exit(int x){(void)x;}
          void __libc_init(void){} int nanosleep(void){return 0;}
          CEOF
          "$TC/clang" --target=armv7a-linux-androideabi -nostdlib -shared \
            -Wl,-soname,libc.so -o /tmp/libc_stub_fb.so /tmp/libcst_fb.c
          mkdir -p gbsys/bin
          "$TC/clang" --target=armv7a-linux-androideabi -marm -O2 \
            -fno-stack-protector -fno-builtin -nostdlib -no-pie \
            -Wl,-e,_start -Wl,--no-undefined \
            -Wl,-dynamic-linker,/system/bin/linker \
            -o gbsys/bin/fbprobe fbprobe/fbprobe.c /tmp/libc_stub_fb.so
          "$TC/llvm-readelf" -h gbsys/bin/fbprobe | grep -q 'Class:.*ELF32'
          "$TC/llvm-readelf" -h gbsys/bin/fbprobe | grep -q 'Type:.*EXEC'
          "$TC/llvm-readelf" -d gbsys/bin/fbprobe | grep -q 'NEEDED.*libc.so'
          if "$TC/llvm-readelf" -r gbsys/bin/fbprobe | grep -q IRELATIVE; then
            echo "fbprobe carries IRELATIVE relocs (2.3 linker cannot)" >&2; exit 1
          fi
          ls -la gbsys/bin/fbprobe
      - name: Fetch Gingerbread system subset (SDK API 10 system image)
        run: |
          set -euo pipefail
          test -f sysimg10.zip || curl -fsSL --retry 3 --connect-timeout 30 -o sysimg10.zip \
            "https://dl.google.com/android/repository/sys-img/android/armeabi-v7a-10_r05.zip"
          echo "b3c6188ca95bea7299b8325bd3bbd4f504fc85545befec979728f2ed169878df  sysimg10.zip" | sha256sum -c -
          unzip -o -q sysimg10.zip "armeabi-v7a/system.img"
          mkdir -p gbsys/bin gbsys/lib gbsys/lib/hw gbsys/lib/egl gbsys/media gbsys/framework
          for p in bin/linker bin/servicemanager bin/toolbox bin/sh \
                   framework/framework-res.apk \
                   build.prop \
                   bin/app_process bin/dexopt bin/dalvikvm \
                   framework/core.jar framework/core.odex \
                   framework/bouncycastle.jar framework/bouncycastle.odex \
                   framework/ext.jar framework/ext.odex \
                   framework/framework.jar framework/framework.odex \
                   framework/android.policy.jar framework/android.policy.odex \
                   framework/services.jar framework/services.odex \
                   framework/core-junit.jar framework/core-junit.odex \
                   lib/libc.so lib/libm.so lib/libstdc++.so lib/libdl.so \
                   lib/liblog.so lib/libcutils.so lib/libbinder.so \
                   lib/libutils.so lib/libz.so lib/libETC1.so \
                   bin/surfaceflinger bin/bootanimation \
                   lib/libsurfaceflinger.so lib/libsurfaceflinger_client.so \
                   lib/libui.so lib/libEGL.so lib/libGLESv1_CM.so \
                   lib/libhardware.so lib/libhardware_legacy.so \
                   lib/libpixelflinger.so lib/libskia.so lib/libjpeg.so \
                   lib/libemoji.so lib/libnetutils.so lib/libwpa_client.so \
                   lib/libandroid_runtime.so lib/libdvm.so \
                   lib/libnativehelper.so lib/libgui.so \
                   lib/libcamera_client.so lib/libskiagl.so \
                   lib/libsqlite.so lib/libsonivox.so \
                   lib/libcrypto.so lib/libssl.so \
                   lib/libicuuc.so lib/libicui18n.so \
                   lib/libmedia.so lib/libnfc_ndef.so \
                   lib/libexpat.so lib/libGLESv2.so \
                   lib/hw/gralloc.default.so lib/egl/libGLES_android.so; do
            debugfs -R "dump -p /$p gbsys/$p" armeabi-v7a/system.img 2>/dev/null
            test -s "gbsys/$p" || { echo "missing from system.img: $p" >&2; exit 1; }
          done
          # The SDK image's egl.cfg selects the emulator's
          # GL-forwarding stack (needs /dev/qemu_pipe, which
          # does not exist here). Point EGL at the stock
          # software renderer instead (S6 design note).
          printf '0 0 android\n' > gbsys/lib/egl/egl.cfg
          # The image carries no libEGL_android.so, but the
          # EGL loader insists on dlopening libEGL_<tag>.so
          # for the EGL half. libGLES_android.so itself
          # exports the full EGL entry set (39 egl* symbols,
          # verified) -- it is the single-file software
          # driver -- so ship it under both names. SF died
          # in strlen(NULL) on this gap in 0.8.1's field run.
          cp gbsys/lib/egl/libGLES_android.so gbsys/lib/egl/libEGL_android.so
          # Optional: the stock boot animation archive. The
          # SDK image may not carry one; bootanimation then
          # falls back to its built-in logo animation.
          debugfs -R "dump -p /media/bootanimation.zip gbsys/media/bootanimation.zip" armeabi-v7a/system.img 2>/dev/null || true
          # Gun 5: bootanimation's built-in ANDROID animation
          # loads its two logo textures from the default asset
          # source, framework-res.apk. The guest rootfs lacked
          # the file entirely (0.9.33 field run: bootanimation
          # stat'd it, got ENOENT, and animated empty textures
          # all run). Assert the logos are really inside, so a
          # silent absence fails the build instead of the run.
          unzip -l gbsys/framework/framework-res.apk | grep -q 'assets/images/android-logo-mask.png'
          unzip -l gbsys/framework/framework-res.apk | grep -q 'assets/images/android-logo-shine.png'
          # Gun 5: preset the boot wordmark bright white.
          # The stock shine texture is a dim gleam: on the
          # shell's small preview the composed logo reads
          # as black-on-black even when composition is
          # correct. Recoloring is a guest-asset choice
          # (OEMs ship their own boot marks exactly this
          # way); the supervisor's bbox telemetry still
          # judges composition geometry on its own merits.
          python3 - << 'PYEOF'
          import struct, zlib, zipfile, os
          apk = 'gbsys/framework/framework-res.apk'
          name = 'assets/images/android-logo-shine.png'
          with zipfile.ZipFile(apk) as z:
              data = z.read(name)
          w, h = struct.unpack('>II', data[16:24])
          print('shine texture', w, 'x', h, '-> solid white')
          raw = b''.join(b'\x00' + b'\xff\xff\xff\xff' * w for _ in range(h))
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw))
                 + chunk(b'IEND', b''))
          tmp = 'framework-res-white.apk'
          with zipfile.ZipFile(apk) as zin, \
               zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  zout.writestr(item, png if item.filename == name
                                else zin.read(item.filename))
          os.replace(tmp, apk)
          PYEOF
          ls -la gbsys/bin gbsys/lib gbsys/lib/hw gbsys/lib/egl gbsys/media gbsys/framework
          (cd gbsys && sha256sum bin/linker bin/servicemanager bin/toolbox bin/sh lib/*.so)

      # lbprobe (S5c): a real libbinder client/server. Built
      # after the subset fetch because its symbol stubs are
      # generated from the extracted real libraries; the zip
      # step below therefore runs after it too.
      - name: Build lbprobe (guest libbinder client/server)
        run: |
          set -euo pipefail
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 lbprobe/build_lbprobe.py "$TC" gbsys/lib gbsys/bin/lbprobe
          "$TC/llvm-readelf" -h gbsys/bin/lbprobe | grep -q 'Class:.*ELF32'
          "$TC/llvm-readelf" -h gbsys/bin/lbprobe | grep -q 'Type:.*EXEC'
          "$TC/llvm-readelf" -d gbsys/bin/lbprobe | grep -q 'NEEDED.*libbinder.so'
          ! "$TC/llvm-readelf" -r gbsys/bin/lbprobe | grep -q IRELATIVE

      # gbprobe (S6 gun 4): a real graphics-stack client
      # walking session/surface/lock/post with markers.
      - name: Build gbprobe (guest graphics client)
        run: |
          set -euo pipefail
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 gbprobe/build_gbprobe.py "$TC" gbsys/lib gbsys/bin/gbprobe
          "$TC/llvm-readelf" -h gbsys/bin/gbprobe | grep -q 'Class:.*ELF32'
          "$TC/llvm-readelf" -h gbsys/bin/gbprobe | grep -q 'Type:.*EXEC'
          "$TC/llvm-readelf" -d gbsys/bin/gbprobe | grep -q 'NEEDED.*libsurfaceflinger_client.so'
          ! "$TC/llvm-readelf" -r gbsys/bin/gbprobe | grep -q IRELATIVE

      - name: Zip gbsystem subset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          python3 - <<'PYEOF'
          import os, zipfile
          files = []
          for root, _dirs, names in os.walk('gbsys'):
              for n in sorted(names):
                  files.append(os.path.join(root, n))
          with zipfile.ZipFile('app/src/main/assets/gbsystem.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(files):
                  z.write(f, os.path.relpath(f, 'gbsys'))
          print('gbsystem.zip entries:', len(files))
          PYEOF
          ls -la app/src/main/assets/

      # Guard the payloads' static-ness and the APK contents: if a
      # payload ever gains an INTERP segment it cannot be exec'd
      # without a loader, and if any payload is missing from the
      # APK the shell cannot start the engine at all (spec 5).
      - name: Assert payloads
        run: |
          if readelf -l app/src/main/jniLibs/arm64-v8a/libguest.so | grep -q INTERP; then
            echo "guest must be fully static (no INTERP)" >&2
            exit 1
          fi
          if readelf -l app/src/main/jniLibs/arm64-v8a/libbusybox.so | grep -q INTERP; then
            echo "busybox must be fully static (no INTERP)" >&2
            exit 1
          fi
          if readelf -l app/src/main/jniLibs/arm64-v8a/libbusybox32.so | grep -q INTERP; then
            echo "busybox32 must be fully static (no INTERP)" >&2
            exit 1
          fi
          readelf -h app/src/main/jniLibs/arm64-v8a/libbusybox32.so | grep -q "Class:.*ELF32" \
            || { echo "busybox32 must be ELF32" >&2; exit 1; }
          if readelf -l app/src/main/jniLibs/arm64-v8a/libgbinit.so | grep -q INTERP; then
            echo "gbinit must be fully static (no INTERP)" >&2
            exit 1
          fi
          readelf -h app/src/main/jniLibs/arm64-v8a/libgbinit.so | grep -q "Class:.*ELF32" \
            || { echo "gbinit must be ELF32" >&2; exit 1; }
          if readelf -l app/src/main/jniLibs/arm64-v8a/libgbloader.so | grep -q INTERP; then
            echo "gbloader must have no INTERP (fully static)" >&2
            exit 1
          fi
          readelf -h app/src/main/jniLibs/arm64-v8a/libgbloader.so | grep -q "Class:.*ELF32" \
            || { echo "gbloader must be ELF32" >&2; exit 1; }
          test -s app/src/main/assets/gbsystem.zip \
            || { echo "gbsystem.zip asset missing" >&2; exit 1; }

      # Pinned signing: decode the project's permanent keystore from
      # secrets and hand its coordinates to gradle (build.gradle.kts
      # reads the four env vars). Without this, AGP signs with a debug
      # key generated fresh on the runner, so every build's signature
      # differs and Android refuses overlay installs. Passwords travel
      # only via secrets/env, never through repo files; when the
      # secrets are absent (e.g. forks) nothing is set and gradle
      # falls back to the default debug signature.
      - name: Set up pinned signing key
        env:
          PAXVM_KEYSTORE_B64: ${{ secrets.PAXVM_KEYSTORE_B64 }}
          PAXVM_KEYSTORE_PASSWORD: ${{ secrets.PAXVM_KEYSTORE_PASSWORD }}
          PAXVM_KEY_ALIAS: ${{ secrets.PAXVM_KEY_ALIAS }}
          PAXVM_KEY_PASSWORD: ${{ secrets.PAXVM_KEY_PASSWORD }}
        run: |
          if [ -n "$PAXVM_KEYSTORE_B64" ] && [ -n "$PAXVM_KEYSTORE_PASSWORD" ] \
             && [ -n "$PAXVM_KEY_ALIAS" ] && [ -n "$PAXVM_KEY_PASSWORD" ]; then
            echo "$PAXVM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/paxvm.jks"
            {
              echo "PAXVM_KEYSTORE_PATH=$RUNNER_TEMP/paxvm.jks"
              echo "PAXVM_KEYSTORE_PASSWORD=$PAXVM_KEYSTORE_PASSWORD"
              echo "PAXVM_KEY_ALIAS=$PAXVM_KEY_ALIAS"
              echo "PAXVM_KEY_PASSWORD=$PAXVM_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Pinned signing key configured for this build."
          else
            echo "Signing secrets absent; using default debug signing."
          fi

      - name: Build APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Assert APK contents
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk > apk-list.txt
          grep -q "lib/arm64-v8a/libsupervisor.so" apk-list.txt
          grep -q "lib/arm64-v8a/libguest.so" apk-list.txt
          grep -q "lib/arm64-v8a/libbusybox.so" apk-list.txt
          grep -q "lib/arm64-v8a/libbusybox32.so" apk-list.txt
          grep -q "lib/arm64-v8a/libgbinit.so" apk-list.txt
          grep -q "lib/arm64-v8a/libgbloader.so" apk-list.txt
          grep -q "assets/gbsystem.zip" apk-list.txt
          # useLegacyPackaging must survive into the merged manifest:
          # without extractNativeLibs=true the .so payloads never
          # land as executable files in nativeLibraryDir (spec 1.2).
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          "$AAPT" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml \
            | grep -q "extractNativeLibs.*0xffffffff"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paxvm-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
