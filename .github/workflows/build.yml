name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK r27
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust (android + musl targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,aarch64-unknown-linux-musl

      - name: Build supervisor (aarch64-linux-android)
        working-directory: supervisor
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export RANLIB_aarch64_linux_android="$TC/llvm-ranlib"
          cargo build --target aarch64-linux-android --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/supervisor \
             ../app/src/main/jniLibs/arm64-v8a/libsupervisor.so

      # The musl guest must link with rust-lld: the host cc's GNU ld
      # does not understand the aarch64 cortex-a53 erratum flag rustc
      # passes for this target.
      - name: Build guest (aarch64-unknown-linux-musl, static)
        working-directory: guest
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld
          cargo build --target aarch64-unknown-linux-musl --release
          cp target/aarch64-unknown-linux-musl/release/guest \
             ../app/src/main/jniLibs/arm64-v8a/libguest.so

      # M1 guest: static busybox 1.36.1 built from source against
      # musl with CONFIG_FEATURE_SUID=n. Why not a prebuilt package:
      # a FEATURE_SUID=y busybox runs a privilege-drop sequence at
      # every startup (ruid = getuid(), then setgid(rgid), then
      # setuid(ruid) -- libbb/appletlib.c, all inside the
      # FEATURE_SUID guard) even when the binary is not setuid, and
      # Android's app seccomp filter TRAPs the set*id family
      # (bionic SECCOMP_BLOCKLIST_APP lists setgid/setuid/setresgid/
      # setgroups/setfsuid/setfsgid), killing the guest before
      # main() -- proven on a real device across 0.2.1-0.2.5. The
      # supervisor cannot cancel those calls on this kernel
      # (5.4.233 vendor): rewrites at the ptrace entry stop do not
      # stop the filter evaluating the original syscall number.
      # So the calls must not exist: with FEATURE_SUID=n the whole
      # sequence is compiled out and startup touches no set*id.
      # Toolchain: Bootlin's aarch64 musl cross gcc 12.3 (tarball
      # sha256 pinned below, cross-checked against Bootlin's
      # published .sha256), so busybox is compiled against musl
      # end to end, never glibc (the earlier glibc-built guest died
      # even earlier, on rseq at startup). musl.cc was the first
      # choice but is unreachable from GitHub runners (run
      # 42036094797 step 8: curl connect timeout to musl.cc:443),
      # so the toolchain comes from toolchains.bootlin.com. The Alpine busybox-static
      # package used in 0.2.1-0.2.5 has FEATURE_SUID=y compiled in,
      # which is exactly what has to go.
      - name: Build busybox (musl, from source, FEATURE_SUID=n)
        run: |
          set -euo pipefail
          # Bootlin tarball layout: a single top-level directory
          # (aarch64--musl--stable-2023.11-1/) holding bin/, lib/,
          # and the target sysroot; its cross prefix is
          # aarch64-linux- (bin/aarch64-linux-gcc, verified against
          # the tarball contents), NOT musl.cc's aarch64-linux-musl-.
          curl -fsSL --retry 3 --connect-timeout 30 -o bootlin-musl.tar.bz2 \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2023.11-1.tar.bz2"
          echo "3554391a9ae82cc1fe35a6ab0c9efa34a5bac5474b6d527474997256e148c297  bootlin-musl.tar.bz2" | sha256sum -c -
          mkdir -p bootlin-musl
          tar -xjf bootlin-musl.tar.bz2 -C bootlin-musl --strip-components=1
          export PATH="$PWD/bootlin-musl/bin:$PATH"
          curl -fsSL -o busybox-1.36.1.tar.bz2 \
            "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
          echo "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  busybox-1.36.1.tar.bz2" | sha256sum -c -
          tar xjf busybox-1.36.1.tar.bz2
          # The tarball's top-level directory is busybox-1.36.1/
          # (verified against the tar listing); everything below
          # runs inside it.
          cd busybox-1.36.1
          test -f Makefile
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux- defconfig
          # BusyBox ships no scripts/config (that helper is a
          # Linux-kernel tool and is absent from the 1.36.1 tree),
          # so flip options in .config directly, then let oldconfig
          # settle dependencies. The grep assertions fail the step
          # if an option does not end up as intended, checked both
          # before and after oldconfig (oldconfig must not be able
          # to resurrect FEATURE_SUID via its sub-options).
          # CONFIG_TC is turned OFF: 1.36.1's tc applet uses CBQ
          # definitions that current kernel headers have removed,
          # and the guest has no use for tc anyway.
          sed -i 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' .config
          sed -i 's/^# CONFIG_FEATURE_SH_STANDALONE is not set$/CONFIG_FEATURE_SH_STANDALONE=y/' .config
          sed -i 's/^CONFIG_TC=y$/# CONFIG_TC is not set/' .config
          sed -i 's/^CONFIG_FEATURE_SUID=y$/# CONFIG_FEATURE_SUID is not set/' .config
          grep -q "^CONFIG_STATIC=y" .config
          grep -q "^CONFIG_FEATURE_SH_STANDALONE=y" .config
          grep -q "^# CONFIG_TC is not set" .config
          grep -q "^# CONFIG_FEATURE_SUID is not set" .config
          # pipefail would let yes(1)'s SIGPIPE fail this pipeline;
          # the status that matters is make's, i.e. the last
          # command's, which is what remains with pipefail off.
          set +o pipefail
          yes '' | make ARCH=arm64 CROSS_COMPILE=aarch64-linux- oldconfig
          set -o pipefail
          grep -q "^CONFIG_STATIC=y" .config
          grep -q "^CONFIG_FEATURE_SH_STANDALONE=y" .config
          grep -q "^# CONFIG_TC is not set" .config
          grep -q "^# CONFIG_FEATURE_SUID is not set" .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux- -j"$(nproc)"
          file busybox | grep -q "statically linked"
          # The guest acceptance script drives these applets; fail
          # here if the build ever drops one. BusyBox packs applet
          # names as short NUL-separated strings, so match whole
          # lines from strings -n 2. The strings dump goes to a
          # file first: grep -q exiting on match would SIGPIPE the
          # producer and pipefail would report a false failure.
          strings -n 2 busybox > ../bb-strings.txt
          for applet in sh echo pwd cd cat ls wc mkdir touch rm uname; do
            grep -qx "$applet" ../bb-strings.txt \
              || { echo "busybox missing applet: $applet" >&2; exit 1; }
          done
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp busybox "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libbusybox.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      # S2 probe guest: the same busybox 1.36.1, built the same way
      # (musl, from source, FEATURE_SUID=n) but for 32-bit ARM with
      # Bootlin's armv7-eabihf musl toolchain (sha256 pinned from
      # Bootlin's published .sha256 sidecar). The supervisor gained
      # compat-personality support in 0.2.8; this binary is the
      # probe that exercises it -- same source, same config, only
      # the word size differs, so the probe isolates exactly one
      # variable. It ships inside the arm64-v8a jniLibs folder as a
      # payload file: it is exec'd from nativeLibraryDir, never
      # dlopen'd, so its ELF class does not have to match the
      # folder's ABI.
      - name: Build busybox32 (musl, from source, FEATURE_SUID=n, ARM32)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 30 -o bootlin-musl32.tar.bz2 \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--musl--stable-2023.11-1.tar.bz2"
          echo "c01a2b2a762b0e19a7847f4877ba5b35d90bd7e23704956dfe575e8113a1ad7a  bootlin-musl32.tar.bz2" | sha256sum -c -
          mkdir -p bootlin-musl32
          tar -xjf bootlin-musl32.tar.bz2 -C bootlin-musl32 --strip-components=1
          # Discover the cross prefix from the toolchain itself
          # (bin/<prefix>gcc) instead of assuming its spelling.
          GCC_BIN="$(ls "$PWD/bootlin-musl32/bin/"*-gcc | head -1)"
          PREFIX="$(basename "$GCC_BIN" | sed 's/gcc$//')"
          test -n "$PREFIX"
          echo "busybox32 cross prefix: $PREFIX"
          export PATH="$PWD/bootlin-musl32/bin:$PATH"
          curl -fsSL -o busybox32.tar.bz2 \
            "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
          echo "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  busybox32.tar.bz2" | sha256sum -c -
          mkdir -p bb32build
          tar xjf busybox32.tar.bz2 -C bb32build --strip-components=1
          cd bb32build
          test -f Makefile
          make ARCH=arm CROSS_COMPILE="$PREFIX" defconfig
          sed -i 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' .config
          sed -i 's/^# CONFIG_FEATURE_SH_STANDALONE is not set$/CONFIG_FEATURE_SH_STANDALONE=y/' .config
          sed -i 's/^CONFIG_TC=y$/# CONFIG_TC is not set/' .config
          sed -i 's/^CONFIG_FEATURE_SUID=y$/# CONFIG_FEATURE_SUID is not set/' .config
          grep -q "^CONFIG_STATIC=y" .config
          grep -q "^CONFIG_FEATURE_SH_STANDALONE=y" .config
          grep -q "^# CONFIG_TC is not set" .config
          grep -q "^# CONFIG_FEATURE_SUID is not set" .config
          set +o pipefail
          yes '' | make ARCH=arm CROSS_COMPILE="$PREFIX" oldconfig
          set -o pipefail
          grep -q "^CONFIG_STATIC=y" .config
          grep -q "^CONFIG_FEATURE_SH_STANDALONE=y" .config
          grep -q "^# CONFIG_TC is not set" .config
          grep -q "^# CONFIG_FEATURE_SUID is not set" .config
          make ARCH=arm CROSS_COMPILE="$PREFIX" -j"$(nproc)"
          file busybox | grep -q "statically linked"
          readelf -h busybox | grep -q "Class:.*ELF32"
          readelf -h busybox | grep -q "Machine:.*ARM"
          strings -n 2 busybox > ../bb32-strings.txt
          for applet in sh echo pwd cd cat ls wc mkdir touch rm uname; do
            grep -qx "$applet" ../bb32-strings.txt \
              || { echo "busybox32 missing applet: $applet" >&2; exit 1; }
          done
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp busybox "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libbusybox32.so"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      # Guard the payloads' static-ness and the APK contents: if a
      # payload ever gains an INTERP segment it cannot be exec'd
      # without a loader, and if any payload is missing from the
      # APK the shell cannot start the engine at all (spec 5).
      - name: Assert payloads
        run: |
          if readelf -l app/src/main/jniLibs/arm64-v8a/libguest.so | grep -q INTERP; then
            echo "guest must be fully static (no INTERP)" >&2
            exit 1
          fi
          if readelf -l app/src/main/jniLibs/arm64-v8a/libbusybox.so | grep -q INTERP; then
            echo "busybox must be fully static (no INTERP)" >&2
            exit 1
          fi
          if readelf -l app/src/main/jniLibs/arm64-v8a/libbusybox32.so | grep -q INTERP; then
            echo "busybox32 must be fully static (no INTERP)" >&2
            exit 1
          fi
          readelf -h app/src/main/jniLibs/arm64-v8a/libbusybox32.so | grep -q "Class:.*ELF32" \
            || { echo "busybox32 must be ELF32" >&2; exit 1; }

      # Pinned signing: decode the project's permanent keystore from
      # secrets and hand its coordinates to gradle (build.gradle.kts
      # reads the four env vars). Without this, AGP signs with a debug
      # key generated fresh on the runner, so every build's signature
      # differs and Android refuses overlay installs. Passwords travel
      # only via secrets/env, never through repo files; when the
      # secrets are absent (e.g. forks) nothing is set and gradle
      # falls back to the default debug signature.
      - name: Set up pinned signing key
        env:
          PAXVM_KEYSTORE_B64: ${{ secrets.PAXVM_KEYSTORE_B64 }}
          PAXVM_KEYSTORE_PASSWORD: ${{ secrets.PAXVM_KEYSTORE_PASSWORD }}
          PAXVM_KEY_ALIAS: ${{ secrets.PAXVM_KEY_ALIAS }}
          PAXVM_KEY_PASSWORD: ${{ secrets.PAXVM_KEY_PASSWORD }}
        run: |
          if [ -n "$PAXVM_KEYSTORE_B64" ] && [ -n "$PAXVM_KEYSTORE_PASSWORD" ] \
             && [ -n "$PAXVM_KEY_ALIAS" ] && [ -n "$PAXVM_KEY_PASSWORD" ]; then
            echo "$PAXVM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/paxvm.jks"
            {
              echo "PAXVM_KEYSTORE_PATH=$RUNNER_TEMP/paxvm.jks"
              echo "PAXVM_KEYSTORE_PASSWORD=$PAXVM_KEYSTORE_PASSWORD"
              echo "PAXVM_KEY_ALIAS=$PAXVM_KEY_ALIAS"
              echo "PAXVM_KEY_PASSWORD=$PAXVM_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Pinned signing key configured for this build."
          else
            echo "Signing secrets absent; using default debug signing."
          fi

      - name: Build APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Assert APK contents
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk > apk-list.txt
          grep -q "lib/arm64-v8a/libsupervisor.so" apk-list.txt
          grep -q "lib/arm64-v8a/libguest.so" apk-list.txt
          grep -q "lib/arm64-v8a/libbusybox.so" apk-list.txt
          grep -q "lib/arm64-v8a/libbusybox32.so" apk-list.txt
          # useLegacyPackaging must survive into the merged manifest:
          # without extractNativeLibs=true the .so payloads never
          # land as executable files in nativeLibraryDir (spec 1.2).
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          "$AAPT" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml \
            | grep -q "extractNativeLibs.*0xffffffff"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paxvm-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
